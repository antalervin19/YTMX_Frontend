<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style/login.css">

    <title>YTMX - Login</title>
</head>
<body>
    <div class="hero">
        <img src="Resources/background.png" alt="background" class="bg-image">
        <div class="gradient-overlay"></div>
    </div>

    <main class="content">
        <div class="brand">
            <img src="Resources/YTMX_Logo.png" alt="YTMX Logo">
            <h1>YTMX</h1>
        </div>

        <h2>Welcome to YTMX</h2>

        <h3>
            Your music. Your vibe. Your world.<br>
            Sign in to discover music, build your library, and keep listening wherever you go.
        </h3>

        <div class="login-form">
            <h1>TO GET STARTED</h1>
            <img class="form-logo" src="Resources/YTMX_Logo.png" alt="YTMX Logo">
            <button type="button">
                <img src="Resources/Google_Logo.svg" alt="">
                Connect with Google
            </button>
        </div>
    </main>
</body>
</html>
